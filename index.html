<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理引擎模拟器 | Physics Engine Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 0;
    }
    .container {
      max-width: 1800px;
      margin: 0 auto;
      background: white;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.9;
    }
    .main {
      display: flex;
      flex-direction: column;
    }
    .content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      order: 1;
    }
    .controls {
      background: #f8f9fa;
      padding: 0;
      border-top: 1px solid #e0e0e0;
      order: 2;
    }
    .controls-toggle {
      background: #667eea;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .controls-content {
      padding: 20px;
      max-height: 500px;
      overflow-y: auto;
    }
    .controls-content.collapsed {
      display: none;
    }
    @media (min-width: 1024px) {
      body { padding: 20px; }
      .container { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
      .header { padding: 30px 40px; }
      h1 { font-size: 32px; margin-bottom: 8px; }
      .subtitle { font-size: 16px; }
      .main { flex-direction: row-reverse; }
      .content { padding: 30px; gap: 25px; order: 1; }
      .controls {
        width: 360px;
        padding: 30px;
        border-top: none;
        border-left: 1px solid #e0e0e0;
        order: 2;
        max-height: calc(100vh - 180px);
        overflow-y: auto;
      }
      .controls-toggle { display: none; }
      .controls-content {
        padding: 0;
        max-height: none;
        display: block !important;
      }
    }
    .control-group {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .control-group:last-child {
      border-bottom: none;
    }
    .control-group h3 {
      font-size: 13px;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-item {
      margin-bottom: 14px;
    }
    .control-item label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    .control-item input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }
    .control-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .control-item input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .control-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .value-display {
      display: inline-block;
      float: right;
      font-size: 11px;
      color: #667eea;
      font-weight: 700;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .checkbox-group label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .animation-container {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      position: relative;
      height: 120px;
      border: 1px solid #e0e0e0;
    }
    @media (min-width: 768px) {
      .animation-container { height: 160px; padding: 20px; }
    }
    @media (min-width: 1024px) {
      .animation-container { height: 200px; }
    }
    .ball {
      position: absolute;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      transition: left 0.016s linear;
      top: 45px;
    }
    @media (min-width: 768px) {
      .ball { width: 35px; height: 35px; top: 62px; }
    }
    @media (min-width: 1024px) {
      .ball { width: 40px; height: 40px; top: 80px; }
    }
    canvas {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      display: block;
      width: 100%;
      height: auto;
    }
    .chart-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    @media (min-width: 768px) {
      .chart-title { font-size: 15px; margin-bottom: 8px; }
    }
    .button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .button:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    .button:active {
      transform: translateY(0);
    }
    @media (min-width: 768px) {
      .button { padding: 14px 24px; font-size: 14px; }
    }
    @media (max-width: 1023px) {
      .button { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ 物理引擎模拟器</h1>
      <p class="subtitle">Physics Engine Simulator - 可视化物理力学模拟器</p>
    </div>
    
    <div class="main">
      <div class="content">
        <div>
          <h2 class="chart-title">实时动画</h2>
          <div class="animation-container" id="animation">
            <div class="ball" id="ball"></div>
          </div>
        </div>

        <div>
          <h2 class="chart-title">位置曲线 x(t)</h2>
          <canvas id="chart-position" width="1350" height="320"></canvas>
        </div>
        
        <div>
          <h2 class="chart-title">速度曲线 v(t)</h2>
          <canvas id="chart-velocity" width="1350" height="320"></canvas>
        </div>

        <div>
          <h2 class="chart-title">加速度曲线 a(t)</h2>
          <canvas id="chart-acceleration" width="1350" height="320"></canvas>
        </div>
      </div>

      <div class="controls">
        <button class="controls-toggle" onclick="toggleControls()">
          <span id="toggle-icon">▼</span>
          <span>参数控制</span>
        </button>
        <div class="controls-content collapsed">
          
        <div class="control-group">
          <h3>🎯 基础参数</h3>
          <div class="control-item">
            <label>初始位置 x₀ <span class="value-display" id="val-x0">-150</span></label>
            <input type="range" id="x0" min="-200" max="0" step="10" value="-150">
          </div>
          <div class="control-item">
            <label>初始速度 v₀ <span class="value-display" id="val-v0">0</span></label>
            <input type="range" id="v0" min="-200" max="200" step="10" value="0">
          </div>
          <div class="control-item">
            <label>物体质量 m <span class="value-display" id="val-mass">1.0</span></label>
            <input type="range" id="mass" min="0.1" max="5" step="0.1" value="1">
          </div>
        </div>

        <div class="control-group">
          <h3>🧠 速度模型</h3>
          <div class="control-item">
            <label>模型类型</label>
            <select id="velocity-model" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
              <option value="traditional">传统物理 (v = ∫a dt)</option>
              <option value="velocity-spring">速度弹簧 (v追v_target)</option>
              <option value="accel-spring">加速度弹簧 (a追a_target)</option>
              <option value="direct-spring">直接弹簧 (v=spring曲线)</option>
            </select>
          </div>
          <div class="control-item" id="spring-params" style="display:none;">
            <label>弹簧响应 <span class="value-display" id="val-vspring-response">0.5</span></label>
            <input type="range" id="vspring-response" min="0.1" max="2" step="0.05" value="0.5">
          </div>
          <div class="control-item" id="spring-damping" style="display:none;">
            <label>弹簧阻尼 <span class="value-display" id="val-vspring-damping">0.8</span></label>
            <input type="range" id="vspring-damping" min="0" max="2" step="0.05" value="0.8">
          </div>
        </div>

        <div class="control-group">
          <h3>🔄 弹簧力 (Spring)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-spring" checked>
            <label>启用弹簧力</label>
          </div>
          <div class="control-item">
            <label>劲度系数 k <span class="value-display" id="val-k">60</span></label>
            <input type="range" id="k" min="0" max="200" step="5" value="60">
          </div>
          <div class="control-item">
            <label>阻尼比 ζ <span class="value-display" id="val-damping">0.74</span></label>
            <input type="range" id="damping" min="0" max="2" step="0.01" value="0.74">
          </div>
        </div>

        <div class="control-group">
          <h3>🌍 重力 (Gravity)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-gravity">
            <label>启用重力</label>
          </div>
          <div class="control-item">
            <label>重力加速度 g <span class="value-display" id="val-g">9.8</span></label>
            <input type="range" id="g" min="0" max="50" step="0.5" value="9.8">
          </div>
        </div>

        <div class="control-group">
          <h3>💨 风力 (Wind)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-wind">
            <label>启用风力</label>
          </div>
          <div class="control-item">
            <label>风力大小 <span class="value-display" id="val-wind">20</span></label>
            <input type="range" id="wind-force" min="-100" max="100" step="5" value="20">
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-wind-periodic">
            <label>周期性风力</label>
          </div>
          <div class="control-item">
            <label>周期 (秒) <span class="value-display" id="val-wind-period">2.0</span></label>
            <input type="range" id="wind-period" min="0.5" max="5" step="0.1" value="2">
          </div>
        </div>

        <div class="control-group">
          <h3>🧲 磁力 (Magnetic)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-magnetic">
            <label>启用磁力</label>
          </div>
          <div class="control-item">
            <label>磁场强度 <span class="value-display" id="val-magnetic">1000</span></label>
            <input type="range" id="magnetic-strength" min="0" max="5000" step="100" value="1000">
          </div>
          <div class="control-item">
            <label>磁源位置 <span class="value-display" id="val-magnetic-pos">50</span></label>
            <input type="range" id="magnetic-pos" min="-200" max="200" step="10" value="50">
          </div>
        </div>

        <div class="control-group">
          <h3>⚡ 电场力 (Electric)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-electric">
            <label>启用电场力</label>
          </div>
          <div class="control-item">
            <label>电场强度 <span class="value-display" id="val-electric">800</span></label>
            <input type="range" id="electric-strength" min="0" max="3000" step="100" value="800">
          </div>
          <div class="control-item">
            <label>电荷位置 <span class="value-display" id="val-electric-pos">-50</span></label>
            <input type="range" id="electric-pos" min="-200" max="200" step="10" value="-50">
          </div>
        </div>

        <div class="control-group">
          <h3>🛑 摩擦力 (Friction)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-static-friction">
            <label>静摩擦力 (v &lt; 阈值)</label>
          </div>
          <div class="control-item">
            <label>静摩擦系数 μₛ <span class="value-display" id="val-mu-static">100</span></label>
            <input type="range" id="mu-static" min="0" max="300" step="10" value="100">
          </div>
          <div class="control-item">
            <label>速度阈值 <span class="value-display" id="val-v-threshold">20</span></label>
            <input type="range" id="v-threshold" min="5" max="100" step="5" value="20">
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="enable-kinetic-friction">
            <label>动摩擦力 (全程)</label>
          </div>
          <div class="control-item">
            <label>动摩擦系数 μₖ <span class="value-display" id="val-mu-kinetic">50</span></label>
            <input type="range" id="mu-kinetic" min="0" max="200" step="10" value="50">
          </div>
        </div>

        <div class="control-group">
          <h3>💨 空气阻力 (Drag)</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="enable-drag">
            <label>启用空气阻力 (∝ v²)</label>
          </div>
          <div class="control-item">
            <label>阻力系数 C <span class="value-display" id="val-drag-coeff">0.5</span></label>
            <input type="range" id="drag-coeff" min="0" max="2" step="0.05" value="0.5">
          </div>
        </div>

        <button class="button" onclick="reset()">🔄 重置</button>
        </div>
      </div>
    </div>
  </div>

  <script src="simulator.js"></script>
</body>
</html>
