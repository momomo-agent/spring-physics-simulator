<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物理引擎模拟器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      height: 100vh;
      background: white;
    }
    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    .controls {
      width: 360px;
      background: #fafafa;
      border-left: 1px solid #e0e0e0;
      padding: 30px;
      overflow-y: auto;
    }
    @media (max-width: 1023px) {
      .container { flex-direction: column; }
      .content { padding: 20px; gap: 20px; flex: 1; }
      .controls {
        width: 100%;
        border-left: none;
        border-top: 1px solid #e0e0e0;
        max-height: 50vh;
      }
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .chart-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0;
    }
    .play-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .play-btn:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }
    .play-btn:active {
      transform: translateY(0);
    }
    .animation-container {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      position: relative;
      height: 200px;
      border: 1px solid #e0e0e0;
    }
    @media (max-width: 768px) {
      .animation-container { height: 120px; padding: 15px; }
    }
    .ball {
      position: absolute;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      transition: left 0.016s linear;
      top: 80px;
    }
    @media (max-width: 768px) {
      .ball { width: 30px; height: 30px; top: 45px; }
    }
    canvas {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background: white;
      display: block;
      width: 100%;
      height: auto;
    }
    .control-group {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }
    .control-group:last-child { border-bottom: none; }
    .control-group h3 {
      font-size: 13px;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .control-item {
      margin-bottom: 14px;
    }
    .control-item label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    .control-item input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
    }
    .control-item input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #667eea;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .control-item input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .control-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .control-item select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 13px;
    }
    .value-display {
      display: inline-block;
      float: right;
      font-size: 11px;
      color: #667eea;
      font-weight: 700;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .checkbox-group label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .reset-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .reset-btn:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }
  
    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-group input[type="range"] {
      flex: 1;
    }
    .number-input {
      width: 70px;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    .number-input:focus {
      outline: none;
      border-color: #667eea;
    }
    .preset-group {
      background: #f0f4ff;
      border: 2px solid #667eea;
      border-radius: 12px;
      padding: 16px !important;
    }
    .preset-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .preset-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
    }
    .preset-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn.save {
      background: #667eea;
      color: white;
    }
    .preset-btn.save:hover {
      background: #5568d3;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .preset-item:hover {
      border-color: #667eea;
      background: #fafbff;
    }
    .preset-name {
      font-weight: 500;
      color: #333;
    }
    .preset-actions {
      display: flex;
      gap: 6px;
    }
    .preset-actions button {
      padding: 4px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-actions .load {
      background: #667eea;
      color: white;
    }
    .preset-actions .load:hover {
      background: #5568d3;
    }
    .preset-actions .delete {
      background: #fee;
      color: #c33;
    }
    .preset-actions .delete:hover {
      background: #fcc;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div>
        <div class="section-header">
          <h2 class="chart-title">实时动画</h2>
          <button class="play-btn" id="play-btn" onclick="togglePlay()">
            <span id="play-icon">▶️</span>
            <span id="play-text">播放</span>
          </button>
          <button class="play-btn" onclick="resetAnimation()" style="background: #64748b;">
            <span>↺</span>
            <span>回到起点</span>
          </button>
        </div>
        <div class="animation-container" id="animation">
          <div class="ball" id="ball"></div>
        </div>
      </div>

      <div>
        <h2 class="chart-title">位置曲线 x(t)</h2>
        <canvas id="chart-position" width="1350" height="320"></canvas>
      </div>
      
      <div>
        <h2 class="chart-title">速度曲线 v(t)</h2>
        <canvas id="chart-velocity" width="1350" height="320"></canvas>
      </div>

      <div>
        <h2 class="chart-title">加速度曲线 a(t)</h2>
        <canvas id="chart-acceleration" width="1350" height="320"></canvas>
      </div>
    </div>

    <div class="controls">

      <div class="control-group preset-group">
        <h3>💾 预设管理</h3>
        <div class="preset-controls">
          <input type="text" id="preset-name" placeholder="输入预设名称" class="preset-input">
          <button onclick="savePreset()" class="preset-btn save">保存</button>
        </div>
        <div id="preset-list" class="preset-list"></div>
      </div>

      <div class="control-group">
        <h3>🎯 基础参数</h3>
        <div class="control-item">
          <label>初始位置 x₀ <span class="value-display" id="val-x0">-150</span></label>
          <div class="input-group">
            <input type="range" id="x0" min="-200" max="0" step="10" value="-150">
            <input type="number" class="number-input" id="input-x0" step="any">
          </div>
        <div class="control-item">
          <label>初始速度 v₀ <span class="value-display" id="val-v0">0</span></label>
          <div class="input-group">
            <input type="range" id="v0" min="-200" max="200" step="10" value="0">
            <input type="number" class="number-input" id="input-v0" step="any">
          </div>
        <div class="control-item">
          <label>物体质量 m <span class="value-display" id="val-mass">1.0</span></label>
          <div class="input-group">
            <input type="range" id="mass" min="0.1" max="5" step="0.1" value="1">
            <input type="number" class="number-input" id="input-mass" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>🧠 速度模型</h3>
        <div class="control-item">
          <label>模型类型</label>
          <select id="velocity-model">
            <option value="traditional">传统物理 (v = ∫a dt)</option>
            <option value="velocity-spring">速度弹簧 (v追v_target)</option>
            <option value="accel-spring">加速度弹簧 (a追a_target)</option>
            <option value="direct-spring">直接弹簧 (v=spring曲线)</option>
          </select>
        </div>
        <div class="control-item" id="spring-params" style="display:none;">
          <label>弹簧响应 <span class="value-display" id="val-vspring-response">0.5</span></label>
          <input type="range" id="vspring-response" min="0.1" max="2" step="0.05" value="0.5">
        </div>
        <div class="control-item" id="spring-damping" style="display:none;">
          <label>弹簧阻尼 <span class="value-display" id="val-vspring-damping">0.8</span></label>
          <input type="range" id="vspring-damping" min="0" max="2" step="0.05" value="0.8">
        </div>
      </div>

      <div class="control-group">
        <h3>🔄 弹簧力 (Spring)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-spring" checked>
          <label>启用弹簧力</label>
        </div>
        <div class="control-item">
          <label>劲度系数 k <span class="value-display" id="val-k">60</span></label>
          <div class="input-group">
            <input type="range" id="k" min="0" max="200" step="5" value="60">
            <input type="number" class="number-input" id="input-k" step="any">
          </div>
        <div class="control-item">
          <label>阻尼比 ζ <span class="value-display" id="val-damping">0.74</span></label>
          <div class="input-group">
            <input type="range" id="damping" min="0" max="2" step="0.01" value="0.74">
            <input type="number" class="number-input" id="input-damping" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>🌍 重力 (Gravity)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-gravity">
          <label>启用重力</label>
        </div>
        <div class="control-item">
          <label>重力加速度 g <span class="value-display" id="val-g">9.8</span></label>
          <div class="input-group">
            <input type="range" id="g" min="0" max="50" step="0.5" value="9.8">
            <input type="number" class="number-input" id="input-g" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>💨 风力 (Wind)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-wind">
          <label>启用风力</label>
        </div>
        <div class="control-item">
          <label>风力大小 <span class="value-display" id="val-wind">20</span></label>
          <div class="input-group">
            <input type="range" id="wind-force" min="-100" max="100" step="5" value="20">
            <input type="number" class="number-input" id="input-wind-force" step="any">
          </div>
        </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-wind-periodic">
          <label>周期性风力</label>
        </div>
        <div class="control-item">
          <label>周期 (秒) <span class="value-display" id="val-wind-period">2.0</span></label>
          <div class="input-group">
            <input type="range" id="wind-period" min="0.5" max="5" step="0.1" value="2">
            <input type="number" class="number-input" id="input-wind-period" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>🧲 磁力 (Magnetic)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-magnetic">
          <label>启用磁力</label>
        </div>
        <div class="control-item">
          <label>磁场强度 <span class="value-display" id="val-magnetic">1000</span></label>
          <div class="input-group">
            <input type="range" id="magnetic-strength" min="0" max="20000" step="100" value="1000">
            <input type="number" class="number-input" id="input-magnetic-strength" step="any">
          </div>
        <div class="control-item">
          <label>磁源位置 <span class="value-display" id="val-magnetic-pos">50</span></label>
          <div class="input-group">
            <input type="range" id="magnetic-pos" min="-200" max="200" step="10" value="50">
            <input type="number" class="number-input" id="input-magnetic-pos" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>⚡ 电场力 (Electric)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-electric">
          <label>启用电场力</label>
        </div>
        <div class="control-item">
          <label>电场强度 <span class="value-display" id="val-electric">800</span></label>
          <div class="input-group">
            <input type="range" id="electric-strength" min="0" max="15000" step="100" value="800">
            <input type="number" class="number-input" id="input-electric-strength" step="any">
          </div>
        <div class="control-item">
          <label>电荷位置 <span class="value-display" id="val-electric-pos">-50</span></label>
          <div class="input-group">
            <input type="range" id="electric-pos" min="-200" max="200" step="10" value="-50">
            <input type="number" class="number-input" id="input-electric-pos" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>🛑 摩擦力 (Friction)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-static-friction">
          <label>静摩擦力 (v &lt; 阈值)</label>
        </div>
        <div class="control-item">
          <label>静摩擦系数 μₛ <span class="value-display" id="val-mu-static">100</span></label>
          <div class="input-group">
            <input type="range" id="mu-static" min="0" max="1000" step="10" value="100">
            <input type="number" class="number-input" id="input-mu-static" step="any">
          </div>
        <div class="control-item">
          <label>速度阈值 <span class="value-display" id="val-v-threshold">20</span></label>
          <div class="input-group">
            <input type="range" id="v-threshold" min="5" max="200" step="5" value="20">
            <input type="number" class="number-input" id="input-v-threshold" step="any">
          </div>
        </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="enable-kinetic-friction">
          <label>动摩擦力 (全程)</label>
        </div>
        <div class="control-item">
          <label>动摩擦系数 μₖ <span class="value-display" id="val-mu-kinetic">50</span></label>
          <div class="input-group">
            <input type="range" id="mu-kinetic" min="0" max="800" step="10" value="50">
            <input type="number" class="number-input" id="input-mu-kinetic" step="any">
          </div>
      </div>

      <div class="control-group">
        <h3>💨 空气阻力 (Drag)</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="enable-drag">
          <label>启用空气阻力 (∝ v²)</label>
        </div>
        <div class="control-item">
          <label>阻力系数 C <span class="value-display" id="val-drag-coeff">0.5</span></label>
          <div class="input-group">
            <input type="range" id="drag-coeff" min="0" max="10" step="0.05" value="0.5">
            <input type="number" class="number-input" id="input-drag-coeff" step="any">
          </div>
      </div>

      <button class="reset-btn" onclick="reset()">🔄 重置</button>
    </div>
  </div>

  <script src="simulator.js"></script>
</body>
</html>
